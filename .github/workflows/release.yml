# Gera os instaladores do app desktop (Windows e Linux) e publica numa Release do GitHub.
# Dispara ao enviar uma tag de versão: git tag v0.2.0 && git push origin v0.2.0
# A tag precisa ser igual à versão do package.json (com "v" na frente).

name: Release desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  criar-release:
    name: Criar rascunho da release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.criar.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir tag e versão
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($versao)."
            exit 1
          fi

      - id: criar
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            // Reaproveita o rascunho de uma execução anterior da mesma tag (ex.: depois de uma falha).
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            const anterior = releases.find((r) => r.tag_name === tag)
            if (anterior && !anterior.draft) throw new Error(`A release ${tag} já foi publicada.`)
            if (anterior) {
              for (const asset of anterior.assets) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id })
              }
              return anterior.id
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Proof of Study ${tag}`,
              draft: true,
              generate_release_notes: true,
              body: [
                '## Como instalar',
                '',
                'Baixe o arquivo do seu sistema em **Assets**, logo abaixo. Não precisa compilar nada.',
                '',
                '### Windows',
                '',
                '- **Instalador:** o arquivo terminado em `_x64-setup.exe`.',
                '- **Aviso do SmartScreen:** o instalador não é assinado, então o Windows pode avisar na primeira vez. Clique em **Mais informações** → **Executar assim mesmo**.',
                '- **Versão nova:** baixe e rode o instalador da release mais recente por cima; os dados continuam.',
                '',
                '### Linux',
                '',
                '- **Ubuntu, Debian, Mint:** o `.deb` (`sudo apt install ./arquivo.deb`).',
                '- **Fedora, openSUSE:** o `.rpm` (`sudo dnf install ./arquivo.rpm`).',
                '- **Outras distros:** o `.AppImage` (`chmod +x` e abrir).',
                '- **Wayland:** a janela ativa só é lida em apps do XWayland. Para o registro completo, entre na sessão **X11** ("GNOME em Xorg", "Plasma (X11)").',
                '',
                'Durante o pomodoro, o app lê só o **título da janela ativa** e o **nome do programa**. Nada de teclas, imagens da tela ou URL, e tudo fica só no seu computador.',
              ].join('\n'),
            })
            return data.id

  instaladores:
    name: Instalador (${{ matrix.nome }})
    needs: criar-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            pacotes: nsis
          # 22.04 para o AppImage rodar também em distros mais antigas (glibc).
          - nome: Linux
            os: ubuntu-22.04
            pacotes: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Testes do Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Compila e sobe os instaladores na release criada acima.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.criar-release.outputs.id }}
          args: --bundles ${{ matrix.pacotes }}

  publicar:
    name: Publicar release
    needs: [criar-release, instaladores]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number('${{ needs.criar-release.outputs.id }}'),
              draft: false,
              make_latest: 'true',
            })
