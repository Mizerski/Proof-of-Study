[package]
name = "proof-of-study"
version = "0.1.0"
description = "Banco de horas de estudo com pomodoro que registra o foco"
authors = ["Mizerski"]
license = ""
repository = "https://github.com/Mizerski/Proof-of-Study"
edition = "2024"
rust-version = "1.90"

[lib]
name = "proof_of_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2.12.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Título da janela ativa, nome do programa e tempo sem mexer no teclado e mouse.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
